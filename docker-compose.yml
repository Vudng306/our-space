services:
  db:
    image: postgres:16-alpine
    container_name: ourspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourspace
      POSTGRES_PASSWORD: ourspace
      POSTGRES_DB: ourspace
    ports:
      - "5436:5432"
    volumes:
      - ourspace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourspace -d ourspace"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ourspace-pgdata:
